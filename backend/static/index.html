<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>后端八股刷题助手</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .tabs {
            margin-bottom: 20px;
        }

        .tabs button {
            padding: 8px 16px;
            margin-right: 8px;
            cursor: pointer;
        }

        #module-bar button {
            padding: 6px 12px;
            margin-right: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
        }
        #module-bar button.active {
            background: #1890ff;
            color: white;
            border-color: #1890ff;
        }

        .tabs button.active {
            background: #1890ff;
            color: white;
            border: none;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .option {
            display: block;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            background: white;
        }

        .option:hover {
            background: #f0f0f0;
        }

        .correct {
            background: #d4edda;
        }

        .wrong {
            background: #f8d7da;
        }

        button.action {
            padding: 10px 24px;
            background: #1890ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 8px;
        }

        .history-toggle {
            width: 100%;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
            text-align: left;
            font: inherit;
        }

        .history-toggle:focus-visible {
            outline: 2px solid #1890ff;
            outline-offset: 4px;
        }
    </style>
</head>

<body>
    <h1>八股刷题小助手</h1>
    <div class="tabs">
        <button onclick="showTab('quiz')" id="tab-quiz">答题</button>
        <button onclick="showTab('daily')" id="tab-daily">每日一练</button>
        <button onclick="showTab('review')" id="tab-review">复习</button>
        <button onclick="showTab('wrong')" id="tab-wrong">错题本</button>
        <button onclick="showTab('favorites')" id="tab-favorites">收藏</button>
        <button onclick="showTab('stats')" id="tab-stats">统计</button>
        <button onclick="showTab('history')" id="tab-history">历史</button>
    </div>

    <div id="view-quiz">
        <div id="module-bar" style="margin-bottom: 16px;">
            <button onclick="setModule('')">全部</button>
            <button onclick="setModule('network')">计算机网络</button>
            <button onclick="setModule('os')">操作系统</button>
            <button onclick="setModule('mysql')">MySQL</button>
            <button onclick="setModule('redis')">Redis</button>
        </div>
        <div class="card" id="question-card">
            <p>点"下一题"开始刷题</p>
            <button class="action" onclick="loadQuestion()">下一题</button>
        </div>
    </div>

    <div id="view-wrong" style="display:none"></div>
    <div id="view-favorites" style="display:none"></div>
    <div id="view-stats" style="display:none"></div>
    <div id="view-daily" style="display:none"></div>
    <div id="view-review" style="display:none"></div>
    <div id="view-history" style="display:none"></div>
    <script>
        const API = "http://127.0.0.1:8000";
        let currentQuestion = null;
        let currentModule = '';
        const dailyHistoryCache = new Map();

        function setModule(m) {
            currentModule = m;
            document.querySelectorAll('#module-bar button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadQuestion();
        }

        function showTab(name) {
                for (const t of ['quiz', 'daily', 'review', 'wrong', 'favorites', 'stats', 'history']) {
                document.getElementById('view-' + t).style.display = 'none';
                document.getElementById('tab-' + t).classList.remove('active');
            }
            document.getElementById('view-' + name).style.display = 'block';
            document.getElementById('tab-' + name).classList.add('active');
            if (name === 'wrong') loadWrong();
            if (name === 'review') loadReview();
            if (name === 'favorites') loadFavorites();
            if (name === 'stats') loadStats();
            if (name === 'daily') loadDaily();
            if (name === 'history') loadHistory();
        }

        async function loadQuestion() {
            let url = API + '/api/questions?limit=1';
            if (currentModule) url += '&module=' + currentModule;
            const res = await fetch(url);
            const data = await res.json();
            if (data.length === 0) {
                document.getElementById('question-card').innerHTML = '<p>这个模块还没有题目</p>';
                return;
            }
            currentQuestion = data[0];
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestion;
            let html = `<h3>[${q.module}] ${q.stem} ${masteryBadge(q.mastery_level)}</h3>`;
            if (q.options) {
                for (const [k, v] of Object.entries(q.options)) {
                    html += `<div class="option" onclick="submitAnswer('${k}')">${k}. ${v}</div>`;
                }
            } else {
                html += `<input type="text" id="short-answer" placeholder="输入你的答案">`;
                html += `<p><button class="action" onclick="submitShort()">提交</button></p>`;
            }
            document.getElementById('question-card').innerHTML = html;
        }

        async function submitAnswer(choice) {
            const res = await fetch(API + '/api/answers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question_id: currentQuestion.id, user_answer: choice })
            });
            const result = await res.json();
            showResult(result);
        }

        function submitShort() {
            const ans = document.getElementById('short-answer').value;
            fetch(API + '/api/answers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question_id: currentQuestion.id, user_answer: ans })
            }).then(r => r.json()).then(showResult);
        }

        function showResult(result) {
            const color = result.is_correct ? 'correct' : 'wrong';
            document.getElementById('question-card').innerHTML = `
                <div class="${color}">
                    <h3>${result.is_correct ? '✓ 答对了！' : '✗ 答错了'}</h3>
                    <p>正确答案：${result.correct_answer}</p>
                    <p>解析：${result.explanation}</p>
                </div>
                <button class="action" onclick="favoriteCurrent()">⭐ 收藏本题</button>
                <button class="action" onclick="loadQuestion()">下一题</button>
            `;
        }

        async function favoriteCurrent() {
            await fetch(API + '/api/favorites/' + currentQuestion.id, { method: 'POST' });
            alert('已收藏！');
        }

        async function loadWrong() {
            const res = await fetch(API + '/api/wrong-questions');
            const data = await res.json();
            let html = `<h2>错题本（共 ${data.length} 题）</h2>`;
            for (const w of data) {
                html += `<div class="card"><p>[${w.module}] ${w.stem}</p><p>正确答案：${w.answer}（错了 ${w.wrong_count} 次）</p><p>${w.explanation}</p><button class="action" onclick="removeWrong(${w.question_id})">已掌握，移出</button></div>`;
            }
            document.getElementById('view-wrong').innerHTML = html;
        }

        async function removeWrong(questionId) {
            await fetch(API + '/api/wrong-questions/' + questionId, { method: 'DELETE' });
            loadWrong();
        }

        async function loadFavorites() {
            const res = await fetch(API + '/api/favorites');
            const data = await res.json();
            let html = `<h2>收藏（共 ${data.length} 题）</h2>`;
            for (const f of data) {
                html += `<div class="card"><p>[${f.module}] ${f.stem}</p><p>答案：${f.answer}</p><p>${f.explanation}</p><button class="action" onclick="removeFavorite(${f.question_id})">取消收藏</button></div>`;
            }
            document.getElementById('view-favorites').innerHTML = html;
        }

        async function removeFavorite(questionId) {
            await fetch(API + '/api/favorites/' + questionId, { method: 'DELETE' });
            loadFavorites();
        }

        async function loadStats() {
            const res = await fetch(API + '/api/stats');
            const s = await res.json();
            let html = `<h2>学习统计</h2>`;
            html += `<div class="card"><p>总答题：${s.total} 题</p><p>答对：${s.correct} 题</p><p>总正确率：${s.accuracy}%</p></div>`;
            html += '<h3>掌握度</h3>';
            html += `<div class="card">
            <p><span style="color:red">薄弱</span>：${s.mastery['薄弱']} 道</p>
            <p><span style="color:orange">一般</span>：${s.mastery['一般']} 道</p>
            <p><span style="color:green">熟练</span>：${s.mastery['熟练']} 道</p>
        </div>`;
            html += '<h3>各模块</h3>';
            for (const m of s.by_module) {
                html += `<div class="card"><p>${m.module}：${m.total} 题，正确率 ${m.accuracy}%</p></div>`;
            }

            document.getElementById('view-stats').innerHTML = html;
        }

        async function loadHistory() {
            const view = document.getElementById('view-history');
            view.innerHTML = '<p>正在加载练习历史...</p>';
            try {
                const res = await fetch(API + '/api/daily/history');
                if (!res.ok) throw new Error('加载历史记录失败');
                const data = await res.json();
                let html = `<h2>练习历史（连续打卡 ${data.streak} 天）</h2>`;
                if (data.records.length === 0) {
                    html += '<p>还没有练习记录</p>';
                } else {
                    for (const record of data.records) {
                        const status = record.is_completed
                            ? '<span style="color:green">已完成</span>'
                            : '<span style="color:orange">未完成</span>';
                        html += `<div class="card">
                            <button class="history-toggle" id="history-toggle-${record.date}" type="button"
                                aria-expanded="false"
                                aria-controls="history-${record.date}"
                                onclick="loadDailyHistory('${record.date}')">
                                ${record.date}　已答 ${record.answered}/${record.total}　
                                已答正确率 ${record.accuracy}%　完成率 ${record.completion_rate}%　
                                ${status}　<span id="history-arrow-${record.date}">▼</span>
                            </button>
                            <div id="history-${record.date}" style="display:none"></div>
                        </div>`;
                    }
                }
                view.innerHTML = html;
            } catch (error) {
                view.innerHTML = '<p style="color:red">历史记录加载失败，请稍后重试</p>';
            }
        }

        async function loadDailyHistory(day) {
            const box = document.getElementById('history-' + day);
            const arrow = document.getElementById('history-arrow-' + day);
            const toggle = document.getElementById('history-toggle-' + day);
            if (box.style.display === 'block') {
                box.style.display = 'none';
                if (arrow) arrow.textContent = '▼';
                if (toggle) toggle.setAttribute('aria-expanded', 'false');
                return;
            }

            if (dailyHistoryCache.has(day)) {
                box.innerHTML = dailyHistoryCache.get(day);
                box.style.display = 'block';
                if (arrow) arrow.textContent = '▲';
                if (toggle) toggle.setAttribute('aria-expanded', 'true');
                return;
            }

            box.innerHTML = '<p>正在加载详情...</p>';
            box.style.display = 'block';
            if (arrow) arrow.textContent = '▲';
            if (toggle) toggle.setAttribute('aria-expanded', 'true');
            try {
                const res = await fetch(API + '/api/daily/history/' + encodeURIComponent(day));
                if (!res.ok) throw new Error('加载历史详情失败');
                const data = await res.json();
                let html = '';
                data.questions.forEach((q, i) => {
                    html += `<p style="margin-top:10px">${i + 1}. [${q.module}] ${q.stem}</p>`;
                    if (q.user_answer !== null && q.user_answer !== undefined) {
                        const answerStatus = q.is_correct
                            ? '<span style="color:green">答对</span>'
                            : '<span style="color:red">答错</span>';
                        html += `<p>${answerStatus}</p>`;
                        if (q.type === 'choice') {
                            for (const [k, v] of Object.entries(q.options)) {
                                let cls = '';
                                if (k === q.correct_answer) cls = 'correct';
                                else if (k === q.user_answer && !q.is_correct) cls = 'wrong';
                                html += `<div class="option ${cls}" style="cursor:default">${k}. ${v}</div>`;
                            }
                        } else {
                            html += `<p style="color:red">你的答案：${q.display_user_answer}</p>`;
                            html += `<div class="correct"><p>正确答案：${q.correct_answer}</p><p>解析：${q.explanation}</p></div>`;
                        }
                    } else {
                        html += `<p style="color:#999">未作答</p>`;
                    }
                });
                dailyHistoryCache.set(day, html);
                box.innerHTML = html;
            } catch (error) {
                box.innerHTML = '<p style="color:red">详情加载失败，请收起后重试</p>';
            }
        }

        async function loadDaily() {
                const res = await fetch(API + '/api/daily');
                const data = await res.json();
                let html = `<h2>每日一练（${data.date}）</h2>`;
                let answeredCount = 0;
                let correctCount = 0;
                data.questions.forEach((q, i) => {
                    html += `<div class="card" id="daily-card-${i}">
        <p>${i + 1}. [${q.module}] ${q.stem} ${masteryBadge(q.mastery_level)}</p>`;
                    if (q.user_answer !== null && q.user_answer !== undefined) {
                        answeredCount++;
                        if (q.is_correct) correctCount++;
                        if (q.type === 'choice') {
                            for (const [k, v] of Object.entries(q.options)) {
                                let cls = 'option';
                                if (k === q.correct_answer) cls += ' correct';
                                else if (k === q.user_answer && !q.is_correct) cls += ' wrong';
                                html += `<div class="${cls}">${k}. ${v}</div>`;
                            }
                        } else {
                            if (q.is_correct) {
                                html += `<div class="correct">`;
                                html += `<p>你的答案：${q.display_user_answer}</p>`;
                                html += `<p>正确答案：${q.correct_answer}</p>`;
                                html += `<p>解析：${q.explanation}</p>`;
                                html += `</div>`;
                            } else {
                                html += `<p style="color:red">你的答案：${q.display_user_answer}</p>`;
                                html += `<div class="correct">`;
                                html += `<p>正确答案：${q.correct_answer}</p>`;
                                html += `<p>解析：${q.explanation}</p>`;
                                html += `</div>`;
                            }
                        }
                    } else {
                        if (q.options) {
                            for (const [k, v] of Object.entries(q.options)) {
                                html += `<div class="option" onclick="submitDailyAnswer(${i}, '${k}', this)">${k}. ${v}</div>`;
                            }
                        } else {
                            html += `<input type="text" id="daily-input-${i}" placeholder="输入你的答案">`;
                            html += `<p><button class="action" onclick="submitDailyShort(${i})">提交</button></p>`;
                        }
                    }
                    html += `</div>`;
                });
                html += `<div id="daily-score"></div>`;
                document.getElementById('view-daily').innerHTML = html;
                window.dailyQuestions = data.questions;
                window.dailyPracticeId = data.practice_id;
                window.dailyDate = data.date;
                window.dailyAnswers = data.questions.map(q => q.is_correct);
                window.dailyDoneIds = data.questions.map(q => q.id);
                renderDailyScore();
                renderLoadMoreButton();
            }

        async function submitDailyAnswer(index, choice, el) {
            const q = window.dailyQuestions[index];
            const res = await fetch(API + '/api/answers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question_id: q.id,
                    user_answer: choice,
                    daily_practice_id: window.dailyPracticeId
                })
            });
            const result = await res.json();
            if (window.dailyDate) dailyHistoryCache.delete(window.dailyDate);
            // 标记对错
            const options = el.parentNode.querySelectorAll('.option');
            options.forEach(o => o.style.pointerEvents = 'none');
            if (result.is_correct) {
                el.classList.add('correct');
            } else {
                el.classList.add('wrong');
                // 高亮正确答案
                options.forEach(o => {
                    if (o.textContent.startsWith(result.correct_answer + '.')) {
                        o.classList.add('correct');
                    }
                });
            }
            window.dailyAnswers[index] = result.is_correct;
            renderDailyScore();
        }

        function masteryBadge(level) {
                if (level === 1) return '<span style="color:red;font-size:14px">薄弱</span>';
                if (level === 2) return '<span style="color:orange;font-size:14px">一般</span>';
                if (level === 3) return '<span style="color:green;font-size:14px">熟练</span>';
                return '';
            }

        async function submitDailyShort(index) {
                const q = window.dailyQuestions[index];
                const ans = document.getElementById('daily-input-' + index).value;
                const res = await fetch(API + '/api/answers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question_id: q.id,
                        user_answer: ans,
                        daily_practice_id: window.dailyPracticeId
                    })
                });
                const result = await res.json();
                if (window.dailyDate) dailyHistoryCache.delete(window.dailyDate);
                const card = document.getElementById('daily-card-' + index);
                let inner = `<p>${index + 1}. [${q.module}] ${q.stem} ${masteryBadge(result.mastery_level || 0)}</p>`;
                if (result.is_correct) {
                    inner += `<div class="correct">
            <p>你的答案：${result.display_user_answer}</p>
            <p>正确答案：${result.correct_answer}</p>
            <p>解析：${result.explanation}</p>
        </div>`;
                } else {
                    inner += `<p style="color:red">你的答案：${result.display_user_answer}</p>`;
                    inner += `<div class="correct">
            <p>正确答案：${result.correct_answer}</p>
            <p>解析：${result.explanation}</p>
        </div>`;
                }
                card.innerHTML = inner;
                window.dailyAnswers[index] = result.is_correct;
                renderDailyScore();
            }

        async function loadMoreDaily() {
                document.getElementById('load-more-btn').querySelector('button').disabled = true;
                const res = await fetch(API + '/api/daily/extend', { method: 'POST' });
                const data = await res.json();
                if (window.dailyDate) dailyHistoryCache.delete(window.dailyDate);
                if (data.count === 0) {
                    alert('没有更多题了');
                    return;
                }
                const container = document.getElementById('view-daily');
                let html = '';
                const startIndex = window.dailyQuestions.length;
                data.questions.forEach((q, i) => {
                    const realIndex = startIndex + i;
                    html += `<div class="card" id="daily-card-${realIndex}">
            <p>${realIndex + 1}. [${q.module}] ${q.stem} ${masteryBadge(q.mastery_level)}</p>`;
                    if (q.options) {
                        for (const [k, v] of Object.entries(q.options)) {
                            html += `<div class="option" onclick="submitDailyAnswer(${realIndex}, '${k}', this)">${k}. ${v}</div>`;
                        }
                    } else {
                        html += `<input type="text" id="daily-input-${realIndex}" placeholder="输入你的答案">`;
                        html += `<p><button class="action" onclick="submitDailyShort(${realIndex})">提交</button></p>`;
                    }
                    html += `</div>`;
                    window.dailyQuestions.push(q);
                    window.dailyDoneIds.push(q.id);
                });
                container.insertAdjacentHTML('beforeend', html);
                renderDailyScore();
                renderLoadMoreButton();
            }

        function renderLoadMoreButton() {
                const container = document.getElementById('view-daily');
                let btn = document.getElementById('load-more-btn');
                if (btn) btn.remove();
                container.insertAdjacentHTML('beforeend',
                    `<p id="load-more-btn" style="text-align:center;margin-top:20px"><button class="action" onclick="loadMoreDaily()">再来5题</button></p>`);
            }

        function renderDailyScore() {
                const container = document.getElementById('view-daily');
                let score = document.getElementById('daily-score-box');
                if (score) score.remove();
                const answered = window.dailyAnswers.filter(a => a === true || a === false).length;
                const total = window.dailyQuestions.length;
                if (answered === total && total > 0) {
                    const correct = window.dailyAnswers.filter(a => a === true).length;
                    container.insertAdjacentHTML('beforeend',
                        `<div id="daily-score-box" class="card" style="text-align:center"><h2>今日得分：${correct} / ${total}</h2></div>`);
                }
            }

        async function loadReview() {
            const res = await fetch(API + '/api/review');
            const data = await res.json();
            let html = `<h2>待复习（${data.count} 题）</h2>`;
            if (data.count === 0) {
                html += `<p>太棒了，今天没有需要复习的题！</p>`;
            }
            data.questions.forEach((q, i) => {
                let badge = '';
                if (q.mastery_level === 1) badge = '<span style="color:red">薄弱</span>';
                else if (q.mastery_level === 2) badge = '<span style="color:orange">一般</span>';
                html += `<div class="card">
                <p>${i + 1}. [${q.module}] ${q.stem} ${badge}</p>`;
                if (q.options) {
                    for (const [k, v] of Object.entries(q.options)) {
                        html += `<div class="option" onclick="submitReviewAnswer(${i}, '${k}', this)">${k}. ${v}</div>`;
                    }
                } else {
                    html += `<input type="text" id="review-input-${i}" placeholder="输入你的答案">`;
                    html += `<p><button class="action" onclick="submitReviewShort(${i})">提交</button></p>`;
                }
                html += `</div>`;
            });
            html += `<div id="review-score"></div>`;
            document.getElementById('view-review').innerHTML = html;
            window.reviewQuestions = data.questions;
            window.reviewAnswers = [];
        }

        async function submitReviewAnswer(index, choice, el) {
            const q = window.reviewQuestions[index];
            const res = await fetch(API + '/api/answers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question_id: q.id, user_answer: choice })
            });
            const result = await res.json();
            const options = el.parentNode.querySelectorAll('.option');
            options.forEach(o => o.style.pointerEvents = 'none');
            if (result.is_correct) {
                el.classList.add('correct');
            } else {
                el.classList.add('wrong');
                options.forEach(o => {
                    if (o.textContent.startsWith(result.correct_answer + '.')) {
                        o.classList.add('correct');
                    }
                });
            }
            window.reviewAnswers[index] = result.is_correct;
            const answered = window.reviewAnswers.filter(a => a !== undefined).length;
            if (answered === window.reviewQuestions.length) {
                const correct = window.reviewAnswers.filter(a => a).length;
                document.getElementById('review-score').innerHTML =
                    `<div class="card" style="text-align:center">
                    <h2>复习完成：${correct} / ${window.reviewQuestions.length}</h2>
                </div>`;
            }
        }

        async function submitReviewShort(index) {
            const q = window.reviewQuestions[index];
            const ans = document.getElementById('review-input-' + index).value;
            const res = await fetch(API + '/api/answers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question_id: q.id, user_answer: ans })
            });
            const result = await res.json();
            const card = document.querySelectorAll('#view-review .card')[index];
            card.innerHTML = `<p>${index + 1}. [${q.module}] ${q.stem}</p>
            <div class="${result.is_correct ? 'correct' : 'wrong'}">
                <p>${result.is_correct ? '✓ 答对了！' : '✗ 答错了'}</p>
                <p>正确答案：${result.correct_answer}</p>
                <p>解析：${result.explanation}</p>
            </div>`;
            window.reviewAnswers[index] = result.is_correct;
            const answered = window.reviewAnswers.filter(a => a !== undefined).length;
            if (answered === window.reviewQuestions.length) {
                const correct = window.reviewAnswers.filter(a => a).length;
                document.getElementById('review-score').innerHTML =
                    `<div class="card" style="text-align:center">
                    <h2>复习完成：${correct} / ${window.reviewQuestions.length}</h2>
                </div>`;
            }
        }
    </script>
</body>

</html>
